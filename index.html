<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Страничка для изучения названий водоёмов России в OpenStreetMap." />
    <meta name="theme-color" content="#f4f5ed" />
    <link rel="canonical" href="https://deevroman.github.io/lakes-names/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="Названия озёр в OSM" />
    <meta property="og:title" content="Названия озёр в OSM" />
    <meta property="og:description" content="Изучение названий водоёмов России в OpenStreetMap." />
    <meta property="og:url" content="https://deevroman.github.io/lakes-names/" />
    <meta property="og:image" content="https://deevroman.github.io/lakes-names/favicon.png" />
    <meta property="og:image:alt" content="Названия озёр в OSM" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Названия озёр в OSM" />
    <meta name="twitter:description" content="Изучение названий водоёмов России в OpenStreetMap." />
    <meta name="twitter:image" content="https://deevroman.github.io/lakes-names/favicon.png" />
    <title>Названия озёр в OSM</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
    <link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css" />
    <link rel="stylesheet" href="vendor/codemirror/codemirror.min.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="query-card">
        <div class="query-layout">
          <div class="query-editor">
            <label class="sr-only" for="query">SQL-запрос</label>
            <textarea id="query" spellcheck="false" rows="14">-- natural=water + name, отобранные из дампа OpenStreetMap России от 2026-10-17.

SELECT * FROM water_objects;

-- Всё работает полностью в браузере благодаря DuckDB. Данные обновляются раз в сутки.
-- Исходный код и данные в формате Parquet: https://github.com/deevroman/lakes-names

-- Не стесняйтесь исправлять кривые теги! (https://github.com/Zverik/osmtags-editor в помощь)
-- И участвуйте в обсуждении соглашения о названиях на форуме: https://c.osm.org/t/148024/18

-- А ниже примеры интересных запросов
</textarea>
            <script>
              try {
                const url = new URL(window.location.href);
                const hashParameters = new URLSearchParams(url.hash.slice(1));
                const hasHashQuery = hashParameters.has('q');
                const hasSearchQuery = url.searchParams.has('q');
                const hasSharedQuery = hasHashQuery || hasSearchQuery;
                const query = hasHashQuery
                  ? hashParameters.get('q')
                  : hasSearchQuery
                    ? url.searchParams.get('q')
                    : window.localStorage.getItem('lakes-names:query');
                if (query !== null) document.getElementById('query').value = query;
                if (hasSharedQuery) {
                  try { window.localStorage.setItem('lakes-names:query', query); } catch {}
                  if (hasSearchQuery) {
                    url.searchParams.delete('q');
                    window.history.replaceState(null, '', url);
                  }
                }
              } catch {}
            </script>
            <div class="examples" aria-label="Примеры запросов">
              <button id="run-query" type="button" disabled>Выполнить</button>
              <button id="share-query" type="button" aria-label="Поделиться запросом" title="Поделиться запросом">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="2.25" /><circle cx="6" cy="12" r="2.25" /><circle cx="18" cy="19" r="2.25" /><path d="m8 11 7.8-4.6M8 13l7.8 4.6" /></svg>
              </button>
              <button id="query-all" type="button" data-query="all">Все данные</button>
              <button id="query-lake" type="button" data-query="lake">water=lake</button>
              <button id="query-popularity" type="button" data-query="popularity">Топ названий</button>
              <button id="query-normalized" type="button" data-query="normalized">Нормированный топ</button>
              <button id="query-plural" type="button" data-query="plural">ОзёрА</button>
              <button id="query-ozerki" type="button" data-query="ozerki">Озерки</button>
              <button id="query-non-lake-named" type="button" data-query="nonLakeNamed">water ≠ lake</button>
              <button id="query-forms" type="button" data-query="forms">🔥Формы name</button>
              <details class="examples-group" data-example-group="additional">
                <summary>Дополнительно</summary>
                <div class="examples-group-items">
                  <button id="query-water-values" type="button" data-query="water-values">Значения water</button>
                  <button id="query-name-length" type="button" data-query="name-length">Длинные name</button>
                  <button id="query-name-whitespace" type="button" data-query="name-whitespace">Пробелы в name</button>
                  <button id="query-name-symbols" type="button" data-query="name-symbols">Символы в name</button>
                  <button id="query-tags" type="button" data-query="tags">Работа с сырыми тегами </button>
                  <button id="query-salty-ponds" type="button" data-query="salty-ponds">Солёные пруды</button>
                </div>
              </details>
              <details class="examples-group" data-example-group="wiki">
                <summary>Вики</summary>
                <div class="examples-group-items">
                  <button id="query-wikidata" type="button" data-query="wikidata">С wikidata</button>
                  <button id="query-wiki" type="button" data-query="wiki">wiki</button>
                </div>
              </details>
              <details class="examples-group" data-example-group="gkgn" open>
                <summary>ГКГН</summary>
                <div class="examples-group-items">
                  <button id="query-gkgn" type="button" data-query="gkgn">Все данные</button>
                  <button id="query-gkgn-types" type="button" data-query="gkgn-types">Типы ГКГН</button>
                  <button id="query-gkgn-osm-matches" type="button" data-query="gkgn-osm-matches">Матчи ГКГН ↔ OSM</button>
                  <button id="query-gkgn-osm-unmatched" type="button" data-query="gkgn-osm-unmatched">ГКГН без матча</button>
                  <button id="query-osm-gkgn-unmatched" type="button" data-query="osm-gkgn-unmatched">OSM без матча</button>
                </div>
              </details>
            </div>
            <script>
              try {
                document.querySelectorAll('[data-example-group]').forEach((group) => {
                  const key = `lakes-names:example-group:${group.dataset.exampleGroup}`;
                  if (window.localStorage.getItem(key) === 'open') group.open = true;
                });
              } catch {}
            </script>
          </div>
          <aside class="map-panel" aria-label="Карта точек результата">
            <div id="map"></div>
            <label class="imagery-toggle">
              <input id="imagery-toggle" type="checkbox" />
              <span>ESRI</span>
            </label>
          </aside>
        </div>
      </section>

      <section class="results" aria-live="polite" aria-label="Результаты SQL-запроса">
        <div class="results-meta-row">
          <button id="result-toggle" type="button" aria-controls="table-wrap" aria-expanded="true" disabled>
            <span class="result-toggle-mark" aria-hidden="true">▸</span>
            <span id="result-meta" class="result-meta"></span>
          </button>
          <div class="export-actions" aria-label="Экспорт результата">
            <button id="toggle-filters" type="button" disabled aria-pressed="false">Фильтры</button>
            <button id="export-csv" type="button" disabled>CSV</button>
            <button id="export-geojson" type="button" disabled>GeoJSON</button>
          </div>
        </div>
        <p id="error" class="error" hidden></p>
        <div id="table-wrap" class="table-wrap">
          <p class="placeholder">Инициализация DuckDB...</p>
        </div>
        <section id="group-flow" class="group-flow" aria-live="polite" hidden></section>
      </section>

    </main>
    <script src="vendor/codemirror/codemirror.min.js"></script>
    <script src="vendor/codemirror/mode/sql/sql.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "apache-arrow": "./vendor/apache-arrow/apache-arrow.mjs",
          "/npm/flatbuffers@24.3.25/+esm": "./vendor/apache-arrow/flatbuffers.mjs",
          "/npm/tslib@2.6.3/+esm": "./vendor/apache-arrow/tslib.mjs"
        }
      }
    </script>
    <script type="module" src="app.js"></script>
  </body>
</html>
